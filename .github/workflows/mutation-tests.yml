name: Scheduled mutation tests

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  backend-mutations:
    name: Backend calculation mutations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: mutation-tests-use-this-nonproduction-secret
      SUPER_ADMIN_EMAIL: mutation-admin@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test and mutation dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Mutate critical calculation modules
        run: mutmut run
      - name: Save mutation summary
        if: always()
        run: mutmut results > mutation-results.txt
      - name: Upload backend mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-results
          path: backend/mutation-results.txt
          if-no-files-found: ignore

  frontend-mutations:
    name: Frontend row transformation mutations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install mutation runner without changing project dependencies
        run: npm install --no-save --no-package-lock @stryker-mutator/core @stryker-mutator/vitest-runner
      - name: Run Stryker
        run: npx stryker run
      - name: Upload frontend mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation-report
          path: client/reports/mutation
          if-no-files-found: ignore
