name: Backend and frontend tests

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL 12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: cmrt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmrt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cmrt_test
      CMRT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cmrt_test
      JWT_SECRET: test-only-secret-for-ci
      SUPER_ADMIN_EMAIL: test-admin@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply all Alembic heads to the isolated test database
        run: alembic upgrade heads
      - name: Run unit, API, property, and PostgreSQL integration tests
        run: pytest --cov=services --cov=crud --cov=routers --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend tests and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Vitest unit and component tests
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage/lcov.info
          if-no-files-found: ignore
      - name: Type-check tests
        run: npm run typecheck:test
      - name: Build production frontend
        run: npm run build
      - name: Run ESLint
        run: npm run lint
